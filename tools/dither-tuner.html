<!DOCTYPE html>
<!--
  DITHER TUNER — dev tool for the resume section's background
  Two WebGL2 dither layers behind a stand-in for the resume card:
    • FAR  — the orange smoke field that's live on the site today
    • NEAR — sparse cobalt wisps on a transparent background, a closer plane
  Same hash → value noise → fBm → domain warp → Bayer dither as index.html,
  with every constant as a live uniform. The card is the control panel, so the
  field only shows in the margins, exactly like the real section. Scroll the
  page to see the parallax; "Copy config" hands the numbers back for porting.
  Not linked from the site. No build step, no deps.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Dither Tuner</title>
<style>
  :root {
    --bg: #ECEAE3;
    --ink: #1c1b18;
    --pumpkin: #C95000;
    --pumpkin-bright: #F2622E;
    --cobalt: #1F4E8C;
    --ink-muted: rgba(28, 27, 24, 0.58);
    --ink-faint: rgba(28, 27, 24, 0.40);
    --line: rgba(28, 27, 24, 0.14);
    --paper: #F4F2EB;
    --frame-line: rgba(28, 27, 24, 0.22);
    --mono: ui-monospace, Menlo, Consolas, "Courier New", monospace;
    --margin: 72px;              /* the field's window — set by the Margin slider */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  html, body { scrollbar-width: thin; scrollbar-color: rgba(201, 80, 0, .40) transparent; }

  /* the two field layers: fixed to the viewport, redrawn each frame with the
     scroll offset baked in (the site uses an oversized translated layer
     instead — same picture, this is just simpler for a tuner) */
  .field {
    position: fixed; left: 0; top: 0;
    image-rendering: pixelated;
    pointer-events: none;
    will-change: transform;
  }
  #far  { z-index: 0; }
  #near { z-index: 1; }

  /* the stand-in resume card. Faint rules every 160px so you can see the card
     plane (speed 1) slide against the two field planes. */
  .page { position: relative; z-index: 2; padding: 96px var(--margin) 96px; }
  .card {
    min-height: 4200px;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 159px, var(--line) 159px 160px);
    border: 1px solid var(--frame-line);
    padding: 28px clamp(16px, 4vw, 48px);
    transition: background-color .2s, border-color .2s;
  }
  .card.ghost { background-color: transparent; background-image: none; border-color: transparent; }

  /* the control panel: sticky inside the card, tabbed so it fits a viewport */
  .panel {
    position: sticky; top: 16px;
    max-width: 600px; margin: 0 auto;
    max-height: calc(100vh - 32px); overflow: auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(28, 27, 24, .08);
  }
  .panel-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 0; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--pumpkin); }
  .eyebrow .prompt { color: var(--ink-faint); }
  .fps { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 6px; padding: 12px 16px 0; border-bottom: 1px solid var(--line); }
  .tab {
    font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-muted); background: none; border: 0; cursor: pointer;
    padding: 8px 10px 9px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pumpkin); }
  .tab[data-tab="near"][aria-selected="true"] { border-bottom-color: var(--cobalt); }
  .tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

  .pane { padding: 6px 16px 16px; }
  .pane[hidden] { display: none; }
  .note { font-size: 12px; color: var(--ink-muted); margin: 8px 0 4px; }

  .row { display: grid; grid-template-columns: 118px 1fr 56px; align-items: center; gap: 10px; margin: 8px 0; }
  .row .lbl { font-size: 11.5px; font-weight: 600; color: var(--ink-muted); }
  .row .lbl small { display: block; font-weight: 400; color: var(--ink-faint); font-size: 10.5px; line-height: 1.25; }
  .row input[type="range"] { width: 100%; accent-color: var(--pumpkin); }
  #pane-near .row input[type="range"] { accent-color: var(--cobalt); }
  .row .val { font-family: var(--mono); font-size: 11.5px; text-align: right; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .row input[type="checkbox"] { accent-color: var(--pumpkin); width: 16px; height: 16px; }

  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatches input[type="color"] { width: 38px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; cursor: pointer; }

  .btn {
    font: inherit; font-size: 13px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 9px; padding: 7px 12px; cursor: pointer; transition: .12s;
  }
  .btn:hover { border-color: var(--pumpkin); color: var(--pumpkin); }
  .btn.primary { background: var(--pumpkin); border-color: var(--pumpkin); color: #fff; }
  .btn.primary:hover { background: var(--pumpkin-bright); color: #fff; }
  .btn[aria-pressed="true"] { border-color: var(--pumpkin); color: var(--pumpkin); }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  textarea {
    width: 100%; height: 260px; margin-top: 10px; resize: vertical;
    font: 11.5px/1.45 var(--mono); color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px;
  }
  .nogl { padding: 16px; font-size: 13px; color: var(--pumpkin); }

  @media (max-width: 560px) {
    .row { grid-template-columns: 92px 1fr 48px; }
  }
</style>
</head>
<body>

<canvas class="field" id="far"></canvas>
<canvas class="field" id="near"></canvas>

<div class="page">
  <div class="card" id="card">
    <div class="panel">
      <div class="panel-head">
        <span class="eyebrow"><span class="prompt">~ $</span> dither --tune</span>
        <span class="fps" id="fps"></span>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="far" aria-selected="true"><span class="dot" style="background:var(--pumpkin)"></span>Far</button>
        <button class="tab" role="tab" data-tab="near" aria-selected="false"><span class="dot" style="background:var(--cobalt)"></span>Near</button>
        <button class="tab" role="tab" data-tab="view" aria-selected="false">View</button>
        <button class="tab" role="tab" data-tab="export" aria-selected="false">Export</button>
      </div>
      <div class="pane" id="pane-far"></div>
      <div class="pane" id="pane-near" hidden></div>
      <div class="pane" id="pane-view" hidden></div>
      <div class="pane" id="pane-export" hidden>
        <p class="note">These are the numbers to port back into index.html. Your settings are also remembered in this browser.</p>
        <textarea id="out" readonly spellcheck="false"></textarea>
        <div class="btnrow">
          <button class="btn primary" id="copy">Copy config</button>
          <button class="btn" id="reset-all">Reset everything</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ── defaults ─────────────────────────────────────────────────────────
  // Both start at the values live on the site (CONFIG.FAR / CONFIG.NEAR and
  // CONFIG.SPEED in index.html). Note the site only parallaxes the far layer;
  // its near layer is locked to the page, so a NEAR scroll speed other than 1
  // would need the far layer's travel/keyframe machinery built for it too.
  const DEFAULTS = {
    far: {
      on: true,
      CELL: 9, SCALE: 0.03, WARP: 5.7, OCT: 4, CONTRAST: 1.7, DENSITY: 1.05,
      CUT: 0, OPACITY: 0.55, FLOW: 0.05, SPEED: 0.23,
      PALETTE: ['#E8C58A', '#D98A3D', '#C95000', '#F2622E'],
    },
    near: {
      on: true,
      CELL: 16, SCALE: 0.027, WARP: 4.5, OCT: 2, CONTRAST: 2.2, DENSITY: 0.91,
      CUT: 0.76, OPACITY: 0.85, FLOW: 0.08, SPEED: 1,
      PALETTE: ['#9FB7D8', '#3F6FB0', '#1F4E8C'],
    },
    view: { MARGIN: 72, CARD: true, PAUSE: false },
  };
  const SEEDS = { far: [0, 0], near: [37.0, -11.0] };   // decorrelates the layers

  const SLIDERS = [
    { k: 'CELL',     min: 3,    max: 32,   step: 1,     lbl: 'Cell size',      hint: 'px per dither pixel' },
    { k: 'SCALE',    min: 0.004, max: 0.12, step: 0.001, lbl: 'Feature scale', hint: 'lower = bigger clouds' },
    { k: 'WARP',     min: 0,    max: 12,   step: 0.1,   lbl: 'Warp',           hint: 'smear into wisps' },
    { k: 'OCT',      min: 1,    max: 6,    step: 1,     lbl: 'Detail',         hint: 'noise octaves' },
    { k: 'CONTRAST', min: 0.5,  max: 4,    step: 0.05,  lbl: 'Contrast' },
    { k: 'DENSITY',  min: 0.3,  max: 2,    step: 0.01,  lbl: 'Density',        hint: 'pigment coverage' },
    { k: 'CUT',      min: 0,    max: 0.95, step: 0.01,  lbl: 'Sparseness',     hint: 'empty sky between wisps' },
    { k: 'OPACITY',  min: 0,    max: 1,    step: 0.01,  lbl: 'Opacity' },
    { k: 'FLOW',     min: 0,    max: 0.4,  step: 0.005, lbl: 'Drift speed' },
    { k: 'SPEED',    min: 0,    max: 1,    step: 0.01,  lbl: 'Scroll speed',   hint: '1 = moves with page, 0 = pinned' },
  ];

  const clone = o => JSON.parse(JSON.stringify(o));
  const STORE = 'dither-tuner-v1';
  let state = clone(DEFAULTS);
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) for (const g of Object.keys(DEFAULTS)) Object.assign(state[g], saved[g] || {});
  } catch (e) { /* storage blocked — just use defaults */ }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

  // ── shader: index.html's field, every constant a uniform ───────────────
  const BAYER = [
    [ 0,32, 8,40, 2,34,10,42],[48,16,56,24,50,18,58,26],
    [12,44, 4,36,14,46, 6,38],[60,28,52,20,62,30,54,22],
    [ 3,35,11,43, 1,33, 9,41],[51,19,59,27,49,17,57,25],
    [15,47, 7,39,13,45, 5,37],[63,31,55,23,61,29,53,21],
  ].flat().map(v => (v + 0.5) / 64);

  const VERT = `#version 300 es
    void main() {
      vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
    }`;
  const FRAG = `#version 300 es
    precision highp float;
    precision highp int;
    uniform float u_t, u_rows, u_rowOff;
    uniform float u_scale, u_warp, u_contrast, u_density, u_cut, u_opacity;
    uniform int u_oct, u_steps;
    uniform vec2 u_seed;
    uniform float u_bayer[64];
    uniform vec3 u_pal[8];          // u_pal[1..u_steps]; index 0 = transparent
    out vec4 o;

    float hash(int ix, int iy) {
      uint n = uint(ix) * 374761393u + uint(iy) * 668265263u;
      n = (n ^ (n >> 13u)) * 1274126177u;
      return float(n ^ (n >> 16u)) / 4294967296.0;
    }
    float vnoise(float x, float y) {
      float xi = floor(x), yi = floor(y);
      float xf = x - xi, yf = y - yi;
      float u = xf * xf * (3.0 - 2.0 * xf), v = yf * yf * (3.0 - 2.0 * yf);
      int ix = int(xi), iy = int(yi);
      float a = hash(ix, iy),     b = hash(ix + 1, iy);
      float c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    float fbm(float x, float y, int oct) {
      float val = 0.0, amp = 0.5, f = 1.0, norm = 0.0;
      for (int i = 0; i < 8; i++) {
        if (i >= oct) break;
        val += amp * vnoise(x * f, y * f); norm += amp; f *= 2.0; amp *= 0.5;
      }
      return val / norm;
    }
    void main() {
      float cx = floor(gl_FragCoord.x);
      float cy = u_rows - 1.0 - floor(gl_FragCoord.y) + u_rowOff;   // world row
      float gx = cx * u_scale + u_seed.x, gy = cy * u_scale + u_seed.y;
      float wx = fbm(gx + 1.7 + u_t * 0.10, gy, 2);
      float wy = fbm(gx, gy + 9.2 - u_t * 0.08, 2);
      float dens = fbm(gx + u_warp * wx, gy + u_warp * wy, u_oct);
      float v = ((dens - 0.5) * u_contrast + 0.5) * u_density;
      v = (v - u_cut) / max(1e-3, 1.0 - u_cut);        // sparseness: lift the floor
      if (v <= 0.0) { o = vec4(0.0); return; }
      float level = clamp(v, 0.0, 0.999) * float(u_steps);
      float lo = floor(level);
      float th = u_bayer[(int(cy) & 7) * 8 + (int(cx) & 7)];
      int idx = int(lo) + ((level - lo) > th ? 1 : 0);
      o = idx == 0 ? vec4(0.0) : vec4(u_pal[idx], u_opacity);
    }`;

  function makeLayer(canvas) {
    const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false, antialias: false, depth: false, stencil: false });
    if (!gl) return null;
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const u = {};
    for (const n of ['u_t','u_rows','u_rowOff','u_scale','u_warp','u_contrast','u_density','u_cut','u_opacity','u_oct','u_steps','u_seed','u_bayer','u_pal'])
      u[n] = gl.getUniformLocation(prog, n);
    gl.uniform1fv(u.u_bayer, BAYER);
    return { gl, u, canvas, t: 0, cols: 0, rows: 0 };
  }

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

  function drawLayer(L, cfg, seed) {
    L.canvas.style.display = cfg.on ? '' : 'none';
    if (!cfg.on) return;
    const { gl, u } = L, cell = cfg.CELL;
    const cols = Math.ceil(innerWidth / cell), rows = Math.ceil(innerHeight / cell) + 1;
    if (cols !== L.cols || rows !== L.rows) {
      L.cols = cols; L.rows = rows;
      L.canvas.width = cols; L.canvas.height = rows;
      L.canvas.style.width = cols * cell + 'px';
      L.canvas.style.height = rows * cell + 'px';
    }
    // world rows scrolled past at this layer's speed; the whole-row part goes
    // to the shader, the remainder is a sub-cell CSS nudge so motion is smooth
    const off = scrollY * cfg.SPEED / cell, iOff = Math.floor(off);
    L.canvas.style.transform = 'translateY(' + (-(off - iOff) * cell).toFixed(2) + 'px)';
    gl.viewport(0, 0, cols, rows);
    gl.uniform1f(u.u_t, L.t);
    gl.uniform1f(u.u_rows, rows);
    gl.uniform1f(u.u_rowOff, iOff);
    gl.uniform1f(u.u_scale, cfg.SCALE);
    gl.uniform1f(u.u_warp, cfg.WARP);
    gl.uniform1f(u.u_contrast, cfg.CONTRAST);
    gl.uniform1f(u.u_density, cfg.DENSITY);
    gl.uniform1f(u.u_cut, cfg.CUT);
    gl.uniform1f(u.u_opacity, cfg.OPACITY);
    gl.uniform1i(u.u_oct, cfg.OCT);
    gl.uniform1i(u.u_steps, cfg.PALETTE.length);
    gl.uniform2f(u.u_seed, seed[0], seed[1]);
    const pal = new Float32Array(24);
    cfg.PALETTE.forEach((h, i) => pal.set(hex(h), (i + 1) * 3));
    gl.uniform3fv(u.u_pal, pal);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ── controls ────────────────────────────────────────────────────────
  const fmt = (v, step) => step >= 1 ? String(v) : Number(v).toFixed(Math.max(0, -Math.floor(Math.log10(step))));
  function row(label, hint, input, valEl) {
    const r = document.createElement('div'); r.className = 'row';
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = label;
    if (hint) { const s = document.createElement('small'); s.textContent = hint; l.appendChild(s); }
    r.append(l, input, valEl || document.createElement('span'));
    return r;
  }
  function slider(obj, s, onChange) {
    const inp = document.createElement('input');
    Object.assign(inp, { type: 'range', min: s.min, max: s.max, step: s.step, value: obj[s.k] });
    const val = document.createElement('span'); val.className = 'val'; val.textContent = fmt(obj[s.k], s.step);
    inp.addEventListener('input', () => { obj[s.k] = +inp.value; val.textContent = fmt(obj[s.k], s.step); onChange(); });
    return row(s.lbl, s.hint, inp, val);
  }
  function check(obj, k, label, hint, onChange) {
    const inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!obj[k];
    inp.addEventListener('change', () => { obj[k] = inp.checked; onChange(); });
    return row(label, hint, inp);
  }

  function buildLayerPane(name) {
    const pane = document.getElementById('pane-' + name);
    pane.textContent = '';
    const cfg = state[name];
    const note = document.createElement('p'); note.className = 'note';
    note.textContent = name === 'far'
      ? 'The orange smoke on the site. Lower scroll speed = it feels further away.'
      : 'Cobalt wisps on a clear background. The site keeps this layer locked to the page (scroll speed 1).';
    pane.append(note, check(cfg, 'on', 'Show layer', null, changed));
    for (const s of SLIDERS) pane.appendChild(slider(cfg, s, changed));
    const sw = document.createElement('div'); sw.className = 'swatches';
    cfg.PALETTE.forEach((h, i) => {
      const c = document.createElement('input'); c.type = 'color'; c.value = h;
      c.title = 'step ' + (i + 1) + ' (light → dense)';
      c.addEventListener('input', () => { cfg.PALETTE[i] = c.value; changed(); });
      sw.appendChild(c);
    });
    pane.appendChild(row('Palette', 'light → dense', sw));
    const br = document.createElement('div'); br.className = 'btnrow';
    const rs = document.createElement('button'); rs.className = 'btn'; rs.textContent = 'Reset this layer';
    rs.addEventListener('click', () => { state[name] = clone(DEFAULTS[name]); buildLayerPane(name); changed(); });
    br.appendChild(rs); pane.appendChild(br);
  }

  let auto = false, autoDir = 1;
  function buildViewPane() {
    const pane = document.getElementById('pane-view');
    pane.textContent = '';
    const v = state.view;
    const note = document.createElement('p'); note.className = 'note';
    note.textContent = 'Widen the margin to see more of the field. On the site it is about 64–72px on desktop and 34px on a phone.';
    pane.append(note,
      slider(v, { k: 'MARGIN', min: 20, max: 600, step: 1, lbl: 'Margin', hint: 'px each side' }, changed),
      check(v, 'CARD', 'Show card', 'off = see the whole field', changed),
      check(v, 'PAUSE', 'Pause drift', 'freeze the smoke, keep parallax', changed));
    const br = document.createElement('div'); br.className = 'btnrow';
    const ab = document.createElement('button'); ab.className = 'btn'; ab.textContent = 'Auto-scroll';
    ab.setAttribute('aria-pressed', 'false');
    ab.addEventListener('click', () => { auto = !auto; ab.setAttribute('aria-pressed', String(auto)); });
    br.appendChild(ab); pane.appendChild(br);
  }

  const out = document.getElementById('out');
  function exportText() {
    const pick = c => {
      const o = {};
      for (const k of ['CELL','SCALE','WARP','OCT','CONTRAST','DENSITY','CUT','OPACITY','FLOW','SPEED']) o[k] = c[k];
      o.PALETTE = ['transparent', ...c.PALETTE];
      return o;
    };
    const cfg = { FAR: state.far.on ? pick(state.far) : null, NEAR: state.near.on ? pick(state.near) : null };
    return '// dither tuner export — ' + new Date().toISOString().slice(0, 10) + '\n' + JSON.stringify(cfg, null, 2);
  }
  function changed() {
    document.documentElement.style.setProperty('--margin', state.view.MARGIN + 'px');
    document.getElementById('card').classList.toggle('ghost', !state.view.CARD);
    out.value = exportText();
    save();
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    document.querySelectorAll('.pane').forEach(p => { p.hidden = p.id !== 'pane-' + t.dataset.tab; });
  }));
  document.getElementById('copy').addEventListener('click', async e => {
    try { await navigator.clipboard.writeText(out.value); }
    catch (err) { out.select(); document.execCommand('copy'); }
    e.target.textContent = 'Copied ✓';
    setTimeout(() => { e.target.textContent = 'Copy config'; }, 1400);
  });
  document.getElementById('reset-all').addEventListener('click', () => {
    state = clone(DEFAULTS);
    buildLayerPane('far'); buildLayerPane('near'); buildViewPane(); changed();
  });

  buildLayerPane('far'); buildLayerPane('near'); buildViewPane(); changed();

  // ── render loop ─────────────────────────────────────────────────────
  let far, near;
  try {
    far = makeLayer(document.getElementById('far'));
    near = makeLayer(document.getElementById('near'));
  } catch (e) { console.error(e); }
  if (!far || !near) {
    const p = document.createElement('p'); p.className = 'nogl';
    p.textContent = 'This browser has no WebGL2, so the tuner cannot draw the field.';
    document.querySelector('.panel').appendChild(p);
    return;
  }

  let prev = performance.now(), frames = 0, fpsT = prev;
  const fpsEl = document.getElementById('fps');
  function tick(now) {
    const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
    if (auto) {
      const maxY = document.documentElement.scrollHeight - innerHeight;
      let y = scrollY + autoDir * 2.2;
      if (y >= maxY) { y = maxY; autoDir = -1; } else if (y <= 0) { y = 0; autoDir = 1; }
      scrollTo(0, y);
    }
    if (!state.view.PAUSE) {
      far.t += dt * state.far.FLOW * 20;
      near.t += dt * state.near.FLOW * 20;
    }
    drawLayer(far, state.far, SEEDS.far);
    drawLayer(near, state.near, SEEDS.near);
    frames++;
    if (now - fpsT >= 500) { fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)) + ' fps'; frames = 0; fpsT = now; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
